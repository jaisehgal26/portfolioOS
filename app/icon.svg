<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    svg { color: #1a1714; }
    @media (prefers-color-scheme: dark) { svg { color: #f3efe8; } }
  </style>
  <mask id="jai-os" maskUnits="userSpaceOnUse" x="4" y="4" width="40" height="40">
    <rect x="4" y="4" width="40" height="40" rx="12" fill="#fff"/>
    <!-- aperture: outer diamond opening -->
    <rect x="12" y="12" width="24" height="24" rx="6" transform="rotate(45 24 24)" fill="#000"/>
    <!-- solid core diamond -->
    <rect x="18" y="18" width="12" height="12" rx="3.5" transform="rotate(45 24 24)" fill="#fff"/>
    <!-- pinhole in the core -->
    <circle cx="24" cy="24" r="2.6" fill="#000"/>
  </mask>
  <rect x="4" y="4" width="40" height="40" rx="12" fill="currentColor" mask="url(#jai-os)"/>
</svg>
